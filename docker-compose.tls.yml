# HTTPS deployment: Sentinel behind an nginx reverse proxy with a
# self-signed certificate (generated automatically on first run).
#
#   docker compose -f docker-compose.tls.yml up -d
#   open https://localhost   (accept the self-signed certificate warning)
#
# For a real domain, replace the self-signed cert in the `sentinel-certs`
# volume with a CA-issued one (e.g. Let's Encrypt) named server.crt / server.key.

services:
  sentinel:
    build: .
    image: sentinel-osint:latest
    container_name: sentinel-osint
    volumes:
      - ./data:/app/data
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: "https://localhost,https://127.0.0.1"
    expose:
      - "8000"           # internal only — not published to the host
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    depends_on:
      - sentinel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - sentinel-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  sentinel-certs:
